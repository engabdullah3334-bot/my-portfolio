<!-- PWA-ready, dark-themed portfolio icon: AA monogram on cyber-navy background -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1629"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Border ring -->
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.4"/>
  <!-- Corner brackets -->
  <path d="M40 80 L40 40 L80 40" fill="none" stroke="#00d4ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M472 80 L472 40 L432 40" fill="none" stroke="#00d4ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M40 432 L40 472 L80 472" fill="none" stroke="#00d4ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M472 432 L472 472 L432 472" fill="none" stroke="#00d4ff" stroke-width="6" stroke-linecap="round"/>
  <!-- Monogram "AA" -->
  <text
    x="256" y="320"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-weight="900"
    font-size="240"
    text-anchor="middle"
    fill="url(#text-grad)"
  >AA</text>
  <!-- Tagline -->
  <text
    x="256" y="390"
    font-family="'Courier New', monospace"
    font-size="32"
    text-anchor="middle"
    fill="#00d4ff"
    opacity="0.6"
  >&lt;engineer /&gt;</text>
</svg>
